name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-core.txt
      # The tests use a fake LLM client and skip the transformer, so no torch or API key is needed.
      - name: Install dependencies
        run: pip install -r requirements-core.txt
      - name: Run tests
        run: pytest -v
